apiVersion: apps/v1
kind: Deployment
metadata:
  name: unicorn-worker
  labels: {app: unicorn, component: worker}
spec:
  replicas: 2
  selector: {matchLabels: {app: unicorn, component: worker}}
  template:
    metadata: {labels: {app: unicorn, component: worker}}
    spec:
      containers:
        - name: worker
          image: unicorn-sovereign/worker:1.0.0
          env:
            - {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: unicorn-secrets, key: database-url}}}
            - {name: REDIS_URL, value: "redis://redis:6379"}
          resources:
            requests: {cpu: "500m", memory: "1Gi"}
            limits: {cpu: "2000m", memory: "4Gi"}
