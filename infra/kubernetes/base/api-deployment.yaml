apiVersion: apps/v1
kind: Deployment
metadata:
  name: unicorn-api
  labels: {app: unicorn, component: api}
spec:
  replicas: 2
  selector: {matchLabels: {app: unicorn, component: api}}
  template:
    metadata: {labels: {app: unicorn, component: api}}
    spec:
      containers:
        - name: api
          image: unicorn-sovereign/api:1.0.0
          ports: [{containerPort: 8000}]
          env:
            - {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: unicorn-secrets, key: database-url}}}
            - {name: REDIS_URL, value: "redis://redis:6379"}
          resources:
            requests: {cpu: "250m", memory: "512Mi"}
            limits: {cpu: "1000m", memory: "1Gi"}
---
apiVersion: v1
kind: Service
metadata: {name: unicorn-api}
spec:
  selector: {app: unicorn, component: api}
  ports: [{port: 8000, targetPort: 8000}]
