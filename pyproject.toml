[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unicorn-sovereign-platform"
version = "1.0.0"
description = "Sovereign runtime with evidence-first capability reporting"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "qiskit>=1.3,<2",
  "qiskit-aer>=0.15,<1",
  "cryptography>=43,<46",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "celery>=5.4,<6",
  "redis>=5.1,<6",
  "requests>=2.32,<3",
  "typer>=0.12,<1",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "jsonschema[format]>=4.23,<5"]

[tool.setuptools.packages.find]
include = ["quantum*", "unicorndrop*"]
exclude = ["experiments*", "infra*", "firmware*", "schemas*"]

[tool.poetry]
name = "unicorn-sovereign-platform"
version = "1.0.0"
description = "Sovereign quantum, AI, NPC, and automation platform"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115"
pydantic = "^2.9"
qiskit = "^1.3"
qiskit-aer = "^0.15"
cryptography = "^43"
sqlalchemy = "^2.0"
alembic = "^1.13"
celery = "^5.4"
redis = "^5.1"
requests = "^2.32"
typer = "^0.12"

[tool.poetry.dev-dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["quantum/tests", "ai-orchestration/tests"]
