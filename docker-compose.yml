services:
  api:
    build: ./unicorn-quantum/apps/api
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://unicorn:local-dev-only@postgres/unicorn
      REDIS_URL: redis://redis:6379
    depends_on: [postgres, redis]
  worker:
    build: ./unicorn-quantum/apps/worker
    depends_on: [postgres, redis]
  web:
    build: ./unicorn-quantum/apps/web
    ports: ["5173:5173"]
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: unicorn
      POSTGRES_USER: unicorn
      POSTGRES_PASSWORD: local-dev-only
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:7
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
volumes:
  postgres_data:
