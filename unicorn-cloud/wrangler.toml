name = "unicorn-cloud-edge"
main = "workers/edge-router/src/index.ts"
compatibility_date = "2024-09-01"

[[d1_databases]]
binding = "DB"
database_name = "unicorn_cloud"
database_id = "placeholder-dev-db-id"

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "unicorn-artifacts"

[env.production]
name = "unicorn-cloud-edge-prod"
