name: Evidence Bundle
on:
  workflow_dispatch:
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python quantum/experiments/software/run_chsh.py
      - run: python quantum/experiments/software/run_negative_controls.py
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-bundle
          path: quantum/experiments/software/*.json
