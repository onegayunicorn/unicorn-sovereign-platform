name: GitHub Repo Monitor
on:
  schedule:
    - cron: '0 * * * *'
  push:
  release:
    types: [published]
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r automation-monitor/requirements.txt
      - run: python -c "from automation_monitor.src.github_monitor import monitor_all; import json; print(json.dumps(monitor_all(json.load(open('automation-monitor/config/repos.json'))['repos']), indent=2))"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
