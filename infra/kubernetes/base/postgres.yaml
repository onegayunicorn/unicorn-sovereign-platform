apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: postgres-pvc}
spec:
  accessModes: ["ReadWriteOnce"]
  resources: {requests: {storage: 50Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres}
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - {name: POSTGRES_DB, value: unicorn}
            - {name: POSTGRES_USER, value: unicorn}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: unicorn-secrets, key: postgres-password}}}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
          ports: [{containerPort: 5432}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: postgres-pvc}}]
---
apiVersion: v1
kind: Service
metadata: {name: postgres}
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
