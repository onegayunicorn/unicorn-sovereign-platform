[tool.poetry]
name = "unicorn-sovereign-platform"
version = "1.0.0"
description = "Sovereign quantum, AI, NPC, and automation platform"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115"
pydantic = "^2.9"
qiskit = "^1.3"
qiskit-aer = "^0.15"
cryptography = "^43"
sqlalchemy = "^2.0"
alembic = "^1.13"
celery = "^5.4"
redis = "^5.1"
requests = "^2.32"
typer = "^0.12"

[tool.poetry.dev-dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["quantum/tests", "ai-orchestration/tests"]
